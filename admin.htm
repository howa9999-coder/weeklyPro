<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة الإدارة - البرنامج الأسبوعي</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header class="topbar">
    <div class="brand">
        <i class="fa-solid fa-graduation-cap"></i>
        البرنامج الخاص
    </div>

    <div class="user-area">
        <i class="fa-solid fa-user-shield"></i>
        المسؤول
    </div>
</header>


<main class="container">

    <div class="page-header">

        <div>
            <h1>البرنامج الأسبوعي</h1>
            <p>إدارة البرنامج الخاص بكل أسبوع.</p>
        </div>

    </div>


    <!-- الأسبوع -->
    <section class="week-card">

        <div class="week-header">

            <div>
                <span class="week-label">الأسبوع</span>
                <span class="week-number">1</span>
            </div>

            <div class="week-actions">
                <button class="icon-btn" title="حفظ">
                    <i class="fa-solid fa-floppy-disk"></i>
                </button>

                <button class="icon-btn danger" title="حذف">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>

        </div>


        <div class="table-container">

            <table class="program-table">

                <thead>
                    <tr>
                        <th class="day-column">اليوم</th>
                        <th>الحفظ الجديد</th>
                        <th>المراجعة</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td class="day-cell">الاثنين</td>

                        <td>
                            <textarea
                                placeholder="أدخل برنامج الحفظ...">الآية 23 - الآية 30</textarea>
                        </td>

                        <td>
                            <textarea
                                placeholder="أدخل برنامج المراجعة...">الآية 15 - الآية 22</textarea>
                        </td>
                    </tr>


                    <tr>
                        <td class="day-cell">الثلاثاء</td>

                        <td>
                            <textarea placeholder="أدخل برنامج الحفظ..."></textarea>
                        </td>

                        <td>
                            <textarea placeholder="أدخل برنامج المراجعة..."></textarea>
                        </td>
                    </tr>


                    <tr>
                        <td class="day-cell">الأربعاء</td>

                        <td>
                            <textarea placeholder="أدخل برنامج الحفظ..."></textarea>
                        </td>

                        <td>
                            <textarea placeholder="أدخل برنامج المراجعة..."></textarea>
                        </td>
                    </tr>


                    <tr>
                        <td class="day-cell">الخميس</td>

                        <td>
                            <textarea placeholder="أدخل برنامج الحفظ..."></textarea>
                        </td>

                        <td>
                            <textarea placeholder="أدخل برنامج المراجعة..."></textarea>
                        </td>
                    </tr>


                    <tr>
                        <td class="day-cell">الجمعة</td>

                        <td>
                            <textarea placeholder="أدخل برنامج الحفظ..."></textarea>
                        </td>

                        <td>
                            <textarea placeholder="أدخل برنامج المراجعة..."></textarea>
                        </td>
                    </tr>


                    <tr>
                        <td class="day-cell">السبت</td>

                        <td>
                            <textarea placeholder="أدخل برنامج الحفظ..."></textarea>
                        </td>

                        <td>
                            <textarea placeholder="أدخل برنامج المراجعة..."></textarea>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>


        <div class="week-footer">

            <span>
                <i class="fa-solid fa-circle-info"></i>
                6 أيام
            </span>

            <a href="studentHome.htm" class="save-btn">
                <i class="fa-solid fa-check"></i>
                حفظ الأسبوع
            </a>

        </div>

    </section>

</main>


<script>

function addWeek() {

    // سيتم ربط هذه الوظيفة لاحقًا بطلب Flask:
    // fetch("/admin/add-week", { method: "POST" })

    alert("سيتم إنشاء أسبوع جديد هنا.");

}

</script>

</body>
</html>
